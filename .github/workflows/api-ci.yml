name: API CI
on:
  pull_request:
    branches: [main]
    paths: ['api/**']
  push:
    branches: [main, feature/api-readonly-service]
    paths: ['api/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -f api/pom.xml clean verify
